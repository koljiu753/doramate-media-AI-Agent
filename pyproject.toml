[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doramate-agent"
version = "0.2.0"
description = "Open-source content automation toolkit for OSS communities"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "DoraMate Community" }
]
keywords = ["agent", "content-automation", "open-source", "robotics", "dora-rs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "edge-tts>=6.1.0",
    "Pillow>=10.0.0",
    "mutagen>=1.47.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
doramate-agent = "doramate_agent.cli:main"

[project.urls]
Homepage = "https://doracc.com"
Repository = "https://github.com/DoraCN/DoraMate"
Issues = "https://github.com/DoraCN/DoraMate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doramate_agent = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
