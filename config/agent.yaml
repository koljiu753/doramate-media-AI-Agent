# ============================================================================
# Agent 行为配置
# ============================================================================
# 这里配置每个 Agent 的行为参数（不涉及项目身份，那个在 project.yaml）
# ============================================================================

# --- LLM 配置 ---
llm:
  # 默认 provider：deepseek（国内直连+便宜）
  # 可选：deepseek / openai / anthropic / qwen / ollama
  default_provider: "deepseek"
  
  # 不同任务可以用不同 provider（分离关注点）
  task_providers:
    content_generation: "deepseek"      # 写文案
    topic_curation: "deepseek"          # 选题
    quality_check: "deepseek"           # 内容审核
    weekly_report: "deepseek"           # 周报生成
  
  # 参数
  temperature: 0.7
  max_tokens: 4000
  timeout_seconds: 60
  retry_times: 3

# --- 创作 Agent ---
creator:
  # 默认生成的平台（启用的）
  default_platforms: ["csdn", "xiaohongshu", "zhihu", "bilibili", "wechat"]
  
  # 创作前是否检索知识库
  use_knowledge_base: true
  
  # 是否在生成内容里强制包含 sponsors 标注
  enforce_sponsor_attribution: true
  
  # 是否自动生成 UTM 链接
  auto_generate_utm: true
  
  # 输出位置
  output_dir: "output/content"

# --- 选题 Agent ---
curator:
  # 数据源（按优先级）
  sources:
    - id: "github_trending"
      enabled: true
      url_template: "https://api.github.com/search/repositories?q=topic:{topic}&sort=stars"
      topics: ["embodied-ai", "robotics", "low-code", "dora-rs"]
      fetch_limit: 10
      
    - id: "zhihu_hot"
      enabled: false   # 知乎需要登录，默认关闭
      keywords: ["具身智能", "机器人开发", "DoraMate"]
      
    - id: "arxiv"
      enabled: true
      categories: ["cs.RO", "cs.AI"]
      keywords: ["embodied", "robotics", "manipulation"]
      fetch_limit: 5
      
    - id: "dora_github"
      enabled: true
      repos: ["dora-rs/dora", "DoraCN/DoraMate"]
      check_releases: true
      check_issues: true
  
  # 推送
  schedule: "0 9 * * *"   # 每天早 9 点（cron 表达式）
  output_dir: "output/topics"
  history_db: "data/topic_history.db"   # 记录已发选题，避免重复

# --- 视频 Agent ---
video:
  # 工作流：text → tts → image → composite → caption
  enabled_steps:
    - "script"           # 脚本生成
    - "tts"              # 语音合成
    - "image_generation" # AI 生图
    - "composite"        # 视频合成
    - "caption"          # 字幕
    - "thumbnail"        # 封面
  
  # TTS 配置
  tts:
    provider: "edge_tts"    # 免费！可选：edge_tts / fishaudio / openai
    voice_zh: "zh-CN-XiaoxiaoNeural"   # 微软 Azure 神经语音
    rate: "+0%"
    pitch: "+0Hz"
    presets:
      default: "zh-CN-XiaoxiaoNeural"       # 通用女声，亲切
      professional: "zh-CN-YunxiNeural"     # 男声，专业
      warm: "zh-CN-XiaoyiNeural"            # 女声，温暖
      energetic: "zh-CN-YunjianNeural"      # 男声，活力
      documentary: "zh-CN-YunyangNeural"    # 男声，纪录片旁白感
  
  # 图像生成配置  
  image_generation:
    provider: "deepseek_image"  # 用 DeepSeek 生图（如未来支持），或 sd
    fallback: "placeholder"     # 不可用时用占位图（让流程跑通）
    style: "flat illustration, technology, modern, minimal"

  # 视觉风格锁：用于让同一条视频的所有 AI 生图保持一致
  visual_style:
    default_preset: "editorial"
    presets:
      editorial:
        name: "DoraCN editorial learning route"
        palette: "clean warm white #F8FAFC, ink #111827, Dora blue #2563EB, cyan #38BDF8, soft green #22C55E accents only"
        composition: "premium Chinese tech media cover illustration, one clear metaphor per scene, 3-layer depth, large calm focal object, plenty of empty subtitle space"
        material: "crisp vector editorial illustration, soft isometric panels, subtle paper grain, clean shadows, no cheap clipart, no generic stock style"
        typography: "minimal poster-like Chinese tech layout area, no fake readable UI text, leave lower third clear for subtitles"
        quality_bar: "looks like a polished article cover from a mature open-source community, not a random AI generated education slide"
        negative_prompt: "no fake DoraMate product screenshot, no real robot hardware demo, no messy dashboard, no neon cyberpunk, no beige/brown/orange palette, no 3D toy style, no anime character, no corporate stock people, no watermark"
      isometric:
        name: "DoraCN soft isometric system map"
        palette: "matte off-white #F8FAFC, deep navy #1B1464, Dora blue #2563EB, cyan #60A5FA, small green status accents"
        composition: "soft isometric knowledge map, connected modules, simple dataflow lines, spacious grid, one main object and two supporting objects"
        material: "flat-isometric vector, crisp edges, restrained shadows, consistent 8px rounded UI blocks, no photorealistic textures"
        typography: "no readable fake interface text, reserve subtitle-safe bottom area"
        quality_bar: "clear enough for a technical explainer video, mature and restrained, not decorative filler"
        negative_prompt: "no fake DoraMate product screenshot, no real robot hardware demo, no cluttered dashboard, no neon, no dark sci-fi, no toy-like 3D, no watermark"
      screenflow:
        name: "DoraCN abstract screenflow"
        palette: "white and light gray workspace, ink #111827, Dora blue #2563EB, cyan highlights, green success dots"
        composition: "abstract browser/code/document panels showing learning progress, clean arrows, route cards, checkpoints, no real product UI"
        material: "high-fidelity vector UI illustration, subtle shadows, clean grid, modern developer documentation aesthetic"
        typography: "use blocks and lines instead of fake readable text, keep captions area empty"
        quality_bar: "feels like official developer documentation artwork, polished but not flashy"
        negative_prompt: "no DoraMate launched UI screenshot, no fake app marketplace, no one-click deploy screen, no random charts, no clutter, no watermark"
      bold_cover:
        name: "DoraCN bold social cover"
        palette: "white base, strong Dora blue #2563EB, deep ink #111827, cyan glow used sparingly, one green accent"
        composition: "bold first-frame social video cover, oversized central symbol, diagonal rhythm, high contrast, readable negative space"
        material: "clean vector poster, sharp geometry, subtle gradient only inside objects, not a full gradient background"
        typography: "large empty headline zone, do not generate small fake text"
        quality_bar: "strong enough for Bilibili/Xiaohongshu first frame while still looking like a serious open-source community"
        negative_prompt: "no tacky neon cyberpunk, no busy collage, no anime, no photorealistic robot, no fake DoraMate product screenshot, no watermark"
    
  # 视频合成
  composite:
    backend: "ffmpeg"
    transition_duration: 0.3
    add_subtitles: true
    add_logo_watermark: true
  
  output_dir: "output/videos"

# --- 周报 Agent ---
reporter:
  # 周报生成时间
  schedule: "0 20 * * 0"   # 每周日 20:00
  
  # 数据源
  data_sources:
    - "csdn_api"
    - "bilibili_api"
    - "github_api"
  
  # 报告格式
  formats: ["markdown", "html"]
  output_dir: "output/reports"
  
  # 是否自动发送（暂时先关闭，避免误发）
  auto_send:
    enabled: false
    channels: []   # 后续可加 slack / 邮件 / 飞书

# --- 数据存储 ---
storage:
  # 默认 SQLite，零部署
  type: "sqlite"
  path: "data/agent.db"

# --- 日志 ---
logging:
  level: "INFO"   # DEBUG / INFO / WARNING / ERROR
  file: "output/logs/agent.log"
  max_size_mb: 50
  backup_count: 5
